########################################################################################
#
# Please note not all available settings / options are set here.
# For a full list, see the wiki
#

# See https://wiki.hyprland.org/Configuring/Monitors/
monitor=DP-1, 2560x1440@180.00Hz, 1920x0, 1
monitor=DP-3, 1920x1080@144.00Hz, 0x0, 1

# See https://wiki.hyprland.org/Configuring/Keywords/ for more


# Source a file (multi-file configs)
# source = ~/.config/hypr/myColors.conf

# Some default env vars.
env = XCURSOR_SIZE,24

debug {
    suppress_errors = false
}
# For all categories, see https://wiki.hyprland.org/Configuring/Variables/
input {
    kb_layout = it
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1
    numlock_by_default = true

    touchpad {
        natural_scroll = no
    }

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.
}

cursor {
    no_warps = true
    no_hardware_cursors = true
}
general {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more

    gaps_in = 0
    gaps_out = 0
    border_size = 1
    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)

    layout = master

    # Please see https://wiki.hyprland.org/Configuring/Tearing/ before you turn this on
    allow_tearing = true
}

decoration {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more

    rounding = 10
    
    blur {
        enabled = false
        size = 3
        passes = 1
    }

}

animations {
    enabled = no

    # Some default animations, see https://wiki.hyprland.org/Configuring/Animations/ for more

    bezier = myBezier, 0.05, 0.9, 0.1, 1.05

    animation = windows, 1, 7, myBezier
    animation = windowsOut, 1, 7, default, popin 80%
    animation = border, 1, 10, default
    animation = borderangle, 1, 8, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, default
}

master {
    mfact = 0.5
}

dwindle {
    # See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
    pseudotile = yes # master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = yes # you probably want this
}

gestures {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more
}

misc {
    on_focus_under_fullscreen = 1
    # See https://wiki.hyprland.org/Configuring/Variables/ for more
    middle_click_paste = false
    force_default_wallpaper = -1 # Set to 0 to disable the anime mascot wallpapers
    vfr = true
    #vrr = 0
    exit_window_retains_fullscreen = true
    key_press_enables_dpms = true
}

binds {
    movefocus_cycles_fullscreen = true
}

# Example per-device config
# See https://wiki.hyprland.org/Configuring/Keywords/#executing for more

# Example windowrule v1
# windowrule = float, ^(kitty)$
# Example windowrule v2
# windowrule = float,class:^(kitty)$,title:^(kitty)$
# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more


# See https://wiki.hyprland.org/Configuring/Keywords/ for more
$mainMod = SUPER

# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
bind = , Print, exec, grim -g "$(slurp -d)" - | tee "$HOME/Pictures/Screenshots/$(date +'%Y-%m-%d_%H-%M-%S').png" | wl-copy
bind = $mainMod, INSERT, exec, pactl set-source-mute @DEFAULT_SOURCE@ toggle
bind = $mainMod SHIFT, INSERT, exec, pactl set-sink-mute @DEFAULT_SINK@ toggle
bind = $mainMod SHIFT, RETURN, exec, alacritty
bindl = $mainMod SHIFT, L, exec, loginctl lock-session
bindl = $mainMod SHIFT, Q, exit,
bind = $mainMod, C, exec, google-chrome-stable 
bind = $mainMod SHIFT, C, killactive, 
bind = $mainMod, T, togglefloating, 
bind = $mainMod, P, exec, pkill fuzzel || fuzzel --list-executables-in-path --keyboard-focus=on-demand --background=161c24ff --selection-color=ffdf00ff
bind = $mainMod, S, pseudo, # dwindle
bind = $mainMod, SPACE, togglesplit, # dwindle
bind = $mainMod, F, fullscreen,1
bind = $mainMod SHIFT, F, fullscreen,0
bind = $mainMod, Z, exec, nautilus
bind = $mainMod, Tab, cyclenext,
bind = ALT, Tab, cyclenext,
bind = $mainMod, J, cyclenext,
bind = $mainMod, K, cyclenext,prev
bind = $mainMod, RETURN, layoutmsg, swapwithmaster master
bind = $mainMod, M, layoutmsg, focusmaster master
bind = $mainMod SHIFT, J, layoutmsg, swapnext
bind = $mainMod SHIFT, K, layoutmsg, swapprev
binde = $mainMod, L, layoutmsg, mfact +0.01
binde = $mainMod, H, layoutmsg, mfact -0.01
bind = $mainMod, comma, layoutmsg, addmaster
bind = $mainMod, period, layoutmsg, removemaster
bind = $mainMod, W, focusmonitor, 0
bind = $mainMod, E, focusmonitor, 1

# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, focusworkspaceoncurrentmonitor, 1
bind = $mainMod, 2, focusworkspaceoncurrentmonitor, 2
bind = $mainMod, 3, focusworkspaceoncurrentmonitor, 3
bind = $mainMod, 4, focusworkspaceoncurrentmonitor, 4
bind = $mainMod, 5, focusworkspaceoncurrentmonitor, 5
bind = $mainMod, 6, focusworkspaceoncurrentmonitor, 6
bind = $mainMod, 7, focusworkspaceoncurrentmonitor, 7
bind = $mainMod, 8, focusworkspaceoncurrentmonitor, 8
bind = $mainMod, 9, focusworkspaceoncurrentmonitor, 9

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspacesilent, 1
bind = $mainMod SHIFT, 2, movetoworkspacesilent, 2
bind = $mainMod SHIFT, 3, movetoworkspacesilent, 3
bind = $mainMod SHIFT, 4, movetoworkspacesilent, 4
bind = $mainMod SHIFT, 5, movetoworkspacesilent, 5
bind = $mainMod SHIFT, 6, movetoworkspacesilent, 6
bind = $mainMod SHIFT, 7, movetoworkspacesilent, 7
bind = $mainMod SHIFT, 8, movetoworkspacesilent, 8
bind = $mainMod SHIFT, 9, movetoworkspacesilent, 9

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

bind = $mainMod, page_up, exec, discover-overlay --rpc --show
bind = $mainMod, page_down, exec, discover-overlay --rpc --hide

# ocr
bind = $mainMod, F8, exec, elveron-shop

#bind = , F10, pass, ^(info.mumble.Mumble)$

# State controls
bind = CTRL ALT, KP_ENTER, exec, playerctl play-pause --player=spotify
bind = CTRL ALT, KP_4,     exec, playerctl previous   --player=spotify
bind = CTRL ALT, KP_LEFT,  exec, playerctl previous   --player=spotify
bind = CTRL ALT, KP_6,     exec, playerctl next       --player=spotify
bind = CTRL ALT, KP_RIGHT, exec, playerctl next       --player=spotify

# Position controls
bind = CTRL ALT, KP_7,      exec, playerctl position 20- --player=spotify
bind = CTRL ALT, KP_HOME,   exec, playerctl position 20- --player=spotify
bind = CTRL ALT, KP_9,      exec, playerctl position 20+ --player=spotify
bind = CTRL ALT, KP_PAGEUP, exec, playerctl position 20+ --player=spotify

# Volume controls
bind = CTRL ALT, KP_1,       exec, amixer set Master 2%-
bind = CTRL ALT, KP_END,     exec, amixer set Master 2%-
bind = CTRL ALT, KP_3,       exec, amixer set Master 2%+
bind = CTRL ALT, KP_NEXT, exec, amixer set Master 2%+

# Generic play-pause
bind = CTRL ALT, KP_0,      exec, playerctl play-pause --ignore-player=spotify
bind = CTRL ALT, KP_INSERT, exec, playerctl play-pause --ignore-player=spotify


# workspace rules
#workspace = 1, on-created-empty: google-chrome-stable
workspace = w[tv1], gapsout:0, gapsin:0
workspace = f[1], gapsout:0, gapsin:0
workspace = 99, on-created-empty:hide

windowrule = border_size 0, rounding 0, match:float 0, match:workspace w[tv1]
windowrule = border_size 0, rounding 0, match:float 0, match:workspace f[1]
# window rules
windowrule = float on, size 1000 600, match:class org.pulseaudio.pavucontrol
windowrule = float on, size 1300 880, match:class xdg-desktop-portal-gtk, match:initial_title All Files
windowrule = float on, size 1300 880, match:class xdg-desktop-portal-gtk, match:initial_title Open Files
windowrule = float on, min_size 1 1, match:class ^(chrome-.*)
windowrule = maximize on, workspace 3 silent, match:class ^(discord)$
windowrule = maximize on, workspace 3 silent, match:class ^(org.telegram.desktop)$
windowrule = float on, match:class ^(org.telegram.desktop)$, match:title ^(Media Viewer)$
windowrule = workspace 3 silent, match:class ^(vesktop)$
windowrule = workspace 5 silent, match:class steam_app_default
windowrule = workspace 8 silent, match:title ^(Warframe)$
windowrule = workspace 8 silent, fullscreen on, match:title ^(EVE)$
windowrule = workspace 4 silent, match:class ^(spotify)$
windowrule = workspace 4 silent, match:class ^(Spotify)$
windowrule = workspace 4 silent, match:title ^(Spotify Free)$
windowrule = workspace 9 silent, match:class ^(steam)$
windowrule = workspace 9 silent, match:class ^(Steam)$
windowrule = workspace 9 silent, match:title ^(Steam)$
windowrule = workspace 9 silent, match:title ^(steam)$
windowrule = workspace 5 silent, match:class ^(upc.exe)$
windowrule = workspace 5 silent, match:class ^(xdefiant.exe)$
windowrule = workspace 6 silent, match:class ^(mpv)$
windowrule = workspace 6 silent, match:class ffplay
windowrule = workspace 7 silent, match:class ^(virt-manager)$
windowrule = workspace 7 silent, match:class ^(code-url-handler)$
#windowrule = workspace 8 silent, class:^(obsidian)$
windowrule = float on, workspace 9 silent, size 460 987, match:title ^(EVE Launcher)$
windowrule = workspace 9 silent, match:class steam_app_8500
#windowrule = tile, xwayland:1
windowrule = workspace 9 silent, match:class net.lutris.Lutris
#windowrule = tile, title:Elveron
windowrule = workspace 5 silent, no_max_size on, suppress_event fullscreen, float on, size 814 486, match:title Elveron Launcher
windowrule = workspace 5 silent, no_max_size on, suppress_event fullscreen, float on, size 200 200, match:class ^(steam_app_default)$, match:title ^(tk)$
windowrule = workspace 5 silent, float on, suppress_event maximize, match:class ^(steam_app_default)$, match:title ^(Elveron)$
windowrule = workspace 5 silent, match:class ^(elveron-launcher.exe)$
windowrule = workspace 5 silent, match:class ^(elveron.exe)$
windowrule = float on, workspace 7 silent, suppress_event maximize, size 1920 1080, match:class ^(Waydroid)$
windowrule = fullscreen_state 0 0, match:class ^(google-chrome|chromium|brave-browser|firefox)$
#windowrule = maxsize 1278 1408, class:^(steam_app_default)$,title:^(Elveron)$
#windowrule = tile, class:^(steam_app_default)$,title:^(Elveron)$
#windowrule = suppressevent fullscreen maximize, title:^(Elveron)$
#windowrule = noborder, title:^(Elveron)$
#windowrule = nofocus, class:^(steam_app_default)$,title:^(Elveron)$
#windowrule = suppressevent fullscreen, class:^(steam_app_default)$,title:^(Elveron)$
#windowrule = suppressevent maximize, class:^(steam_app_default)$,title:^(Elveron)$
#windowrule = suppressevent activate, class:^(steam_app_default)$,title:^(Elveron)$
#windowrule = suppressevent activatefocus, class:^(steam_app_default)$,title:^(Elveron)$
#windowrule = suppressevent fullscreenoutput, class:^(steam_app_default)$,title:^(Elveron)$
#windowrulev2 = float, title:^(AlecaFrame)$
windowrule = float on, match:title ^(AlecaFrame)$
windowrule = float on, pin on, match:class shop-ocr
windowrule = workspace 99 silent, opacity 0.0 override, match:xwayland 1, match:class ^$, match:title ^$

# ENVIRONMENT VARIABLES
env = WLR_RENDERER,vulkan
env = LIBVA_DRIVER_NAME,radeonsi
env = GTK_THEME,Adwaita:dark
env = XDG_SESSION_TYPE,wayland
env = ELECTRON_OZONE_PLATFORM_HINT,auto
env = OGL_DEDICATED_HW_STATE_PER_CONTEXT,ENABLE_ROBUST
env = GDK_BACKEND,wayland,x11,*
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_AUTO_SCREEN_SCALE_FACTOR,1
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = QT_QPA_PLATFORMTHEME,qt6ct
env = SDL_VIDEODRIVER,wayland
env = CLUTTER_BACKEND,wayland
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_DESKTOP,Hyprland
env = GTK_IM_MODULE,fcitx
env = QT_IM_MODULE,fcitx
env = XMODIFIERS,@im=fcitx

# Execute your favorite apps at launch
# startup
# background 
exec = gsettings set org.gnome.desktop.interface color-scheme "prefer-dark"   # for GTK4 apps
exec = gsettings set org.gnome.desktop.interface gtk-theme "adw-gtk3"   # for GTK3 apps
exec-once = "pactl set-source-volume @DEFAULT_SOURCE@ 90%"
exec-once = "pactl set-sink-volume @DEFAULT_SINK@ 60%"
exec-once = waybar
exec-once = swaybg -i /usr/share/backgrounds/arch_linux.png
exec-once = lxpolkit
exec-once = dunst
exec-once = rm ~/hypridle.log
exec-once = hypridle >> hypridle.log 2>&1
exec-once = nm-applet
exec-once = blueman-applet
exec-once = rm ~/.hplip/hp-systray.lock && hp-systray
exec-once = solaar --window=hide
exec-once = joystickwake
#exec-once = swhks
#exec-once = pkexec swhkd -c ~/.config/swhkd/swhkdrc > /dev/null 2>&1
exec-once = sunsetr

# foreground
exec-once = discord
#exec-once = telegram-desktop
exec-once = spotify
#exec-once = obsidian
exec-once = lutris
#exec-once = steam
exec-once = discover-overlay
exec-once = start-tmux

