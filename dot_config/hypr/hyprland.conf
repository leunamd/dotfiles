########################################################################################
#
# Please note not all available settings / options are set here.
# For a full list, see the wiki
#

# See https://wiki.hyprland.org/Configuring/Monitors/
monitor=DP-1, 1920x1080@144.00Hz, 1920x0, 1
monitor=HDMI-A-1, 1920x1080@60.00Hz, 0x0, 1


# See https://wiki.hyprland.org/Configuring/Keywords/ for more


# Source a file (multi-file configs)
# source = ~/.config/hypr/myColors.conf

# Some default env vars.
env = XCURSOR_SIZE,24

debug {
    suppress_errors = true
}
# For all categories, see https://wiki.hyprland.org/Configuring/Variables/
input {
    kb_layout = it
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1
    numlock_by_default = true

    touchpad {
        natural_scroll = no
    }

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.
}

cursor {
    no_warps = true
    no_hardware_cursors = true
}
general {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more

    gaps_in = 0
    gaps_out = 0
    border_size = 1
    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)

    layout = master

    # Please see https://wiki.hyprland.org/Configuring/Tearing/ before you turn this on
    allow_tearing = false
}

decoration {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more

    rounding = 10
    
    blur {
        enabled = false
        size = 3
        passes = 1
    }

    drop_shadow = yes
    shadow_range = 4
    shadow_render_power = 3
    col.shadow = rgba(1a1a1aee)
}

animations {
    enabled = no

    # Some default animations, see https://wiki.hyprland.org/Configuring/Animations/ for more

    bezier = myBezier, 0.05, 0.9, 0.1, 1.05

    animation = windows, 1, 7, myBezier
    animation = windowsOut, 1, 7, default, popin 80%
    animation = border, 1, 10, default
    animation = borderangle, 1, 8, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, default
}

master {
    no_gaps_when_only = 1
    mfact = 0.5
}

dwindle {
    # See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
    pseudotile = yes # master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = yes # you probably want this
}

gestures {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more
    workspace_swipe = off
}

misc {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more
    middle_click_paste = false
    force_default_wallpaper = -1 # Set to 0 to disable the anime mascot wallpapers
    vfr = false
    #vrr = 0
}

# Example per-device config
# See https://wiki.hyprland.org/Configuring/Keywords/#executing for more

# Example windowrule v1
# windowrule = float, ^(kitty)$
# Example windowrule v2
# windowrule = float,class:^(kitty)$,title:^(kitty)$
# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more


# See https://wiki.hyprland.org/Configuring/Keywords/ for more
$mainMod = SUPER

# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
bind = , Print, exec, grim -g "$(slurp -d)" - | tee "$HOME/Pictures/Screenshots/$(date +'%Y-%m-%d_%H-%M-%S').png" | wl-copy
bind = $mainMod, INSERT, exec, pactl set-source-mute @DEFAULT_SOURCE@ toggle
bind = $mainMod SHIFT, INSERT, exec, pactl set-sink-mute @DEFAULT_SINK@ toggle
bind = $mainMod SHIFT, RETURN, exec, alacritty
bind = $mainMod SHIFT, L, exec, loginctl lock-session
bindl = $mainMod SHIFT, Q, exit,
bind = $mainMod, C, exec, google-chrome-stable 
bind = $mainMod SHIFT, C, killactive, 
bind = $mainMod, T, togglefloating, 
bind = $mainMod, P, exec, pkill fuzzel || fuzzel --list-executables-in-path --keyboard-focus=on-demand --background=161c24ff --selection-color=ffdf00ff
bind = $mainMod, S, pseudo, # dwindle
bind = $mainMod, SPACE, togglesplit, # dwindle
bind = $mainMod, F, fullscreen,1
bind = $mainMod SHIFT, F, fullscreen,0
bind = $mainMod, Z, exec, nautilus
bind = $mainMod, Tab, cyclenext,
bind = ALT, Tab, cyclenext,
bind = $mainMod, J, cyclenext,
bind = $mainMod, K, cyclenext,prev
bind = $mainMod, RETURN, layoutmsg, swapwithmaster master
bind = $mainMod, M, layoutmsg, focusmaster master
bind = $mainMod SHIFT, J, layoutmsg, swapnext
bind = $mainMod SHIFT, K, layoutmsg, swapprev
binde = $mainMod, L, layoutmsg, mfact +0.01
binde = $mainMod, H, layoutmsg, mfact -0.01
bind = $mainMod, comma, layoutmsg, addmaster
bind = $mainMod, period, layoutmsg, removemaster
bind = $mainMod, W, focusmonitor, 0
bind = $mainMod, E, focusmonitor, 1

# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, focusworkspaceoncurrentmonitor, 1
bind = $mainMod, 2, focusworkspaceoncurrentmonitor, 2
bind = $mainMod, 3, focusworkspaceoncurrentmonitor, 3
bind = $mainMod, 4, focusworkspaceoncurrentmonitor, 4
bind = $mainMod, 5, focusworkspaceoncurrentmonitor, 5
bind = $mainMod, 6, focusworkspaceoncurrentmonitor, 6
bind = $mainMod, 7, focusworkspaceoncurrentmonitor, 7
bind = $mainMod, 8, focusworkspaceoncurrentmonitor, 8
bind = $mainMod, 9, focusworkspaceoncurrentmonitor, 9

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspacesilent, 1
bind = $mainMod SHIFT, 2, movetoworkspacesilent, 2
bind = $mainMod SHIFT, 3, movetoworkspacesilent, 3
bind = $mainMod SHIFT, 4, movetoworkspacesilent, 4
bind = $mainMod SHIFT, 5, movetoworkspacesilent, 5
bind = $mainMod SHIFT, 6, movetoworkspacesilent, 6
bind = $mainMod SHIFT, 7, movetoworkspacesilent, 7
bind = $mainMod SHIFT, 8, movetoworkspacesilent, 8
bind = $mainMod SHIFT, 9, movetoworkspacesilent, 9

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# workspace rules
#workspace = 1, on-created-empty: google-chrome-stable
workspace = w[tv1], gapsout:0, gapsin:0
workspace = f[1], gapsout:0, gapsin:0

windowrule = bordersize 0, floating:0, onworkspace:w[tv1]
windowrule = rounding 0, floating:0, onworkspace:w[tv1]
windowrule = bordersize 0, floating:0, onworkspace:f[1]
windowrule = rounding 0, floating:0, onworkspace:f[1]
# window rules
windowrule = float,class:org.pulseaudio.pavucontrol
windowrule = float,class:xdg-desktop-portal-gtk,initialTitle:All Files
windowrule = size 1000 600,class:org.pulseaudio.pavucontrol
windowrule = float,class:^(chrome-.*)
windowrule = minsize 1 1,class:^(chrome-.*)
windowrule = maximize, class:^(discord)$
windowrule = maximize, class:^(org.telegram.desktop)$
windowrule = workspace 3 silent, class:^(discord)$
windowrule = workspace 3 silent, class:^(vesktop)$
windowrule = workspace 3 silent, class:^(org.telegram.desktop)$
windowrule = workspace 5 silent, class:steam_app_default
windowrule = tile, xwayland:1
windowrule = workspace 5 silent, class:net.lutris.Lutris
windowrule = tile, title:Elveron
windowrule = workspace 5 silent, class:Elveron Launcher
windowrule = fullscreen, title:^(EVE)$
windowrule = workspace 4 silent, class:^(Spotify)$
windowrule = workspace 4 silent, title:^(Spotify Free)$
windowrule = workspace 5 silent, class:^(steam)$
windowrule = workspace 5 silent, class:^(upc.exe)$
windowrule = workspace 5 silent, class:^(xdefiant.exe)$
windowrule = workspace 6 silent, class:^(mpv)$
windowrule = workspace 6 silent, class:ffplay
windowrule = workspace 7 silent, class:^(virt-manager)$
windowrule = workspace 7 silent, class:^(code-url-handler)$
#windowrule = workspace 8 silent, class:^(obsidian)$

# ENVIRONMENT VARIABLES
env = GTK_THEME,Adwaita:dark
env = LIBVA_DRIVER_NAME,nvidia
env = XDG_SESSION_TYPE,wayland
env = GBM_BACKEND,nvidia-drm
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = ELECTRON_OZONE_PLATFORM_HINT,auto
env = OGL_DEDICATED_HW_STATE_PER_CONTEXT,ENABLE_ROBUST
env = GDK_BACKEND,wayland,x11,*
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_AUTO_SCREEN_SCALE_FACTOR,1
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = QT_QPA_PLATFORMTHEME,qt5ct
env = SDL_VIDEODRIVER,wayland
env = CLUTTER_BACKEND,wayland
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_DESKTOP,Hyprland

# Execute your favorite apps at launch
# startup
# background 
exec-once = waybar
exec-once = swaybg -i /usr/share/backgrounds/arch_linux.png
exec-once = lxpolkit
exec-once = dunst
exec-once = hypridle
exec-once = nm-applet
exec-once = blueman-applet
exec-once = rm ~/.hplip/hp-systray.lock && hp-systray
exec-once = solaar --window=hide
exec-once = joystickwake
exec-once = swhks
exec-once = pkexec swhkd -c ~/.config/swhkd/swhkdrc > /dev/null 2>&1
exec-once = sunsetr

# foreground
exec-once = discord
exec-once = telegram-desktop
exec-once = spotify
#exec-once = obsidian
