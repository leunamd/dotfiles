general {
    # Lock screen with swaylock, then turn off monitor and lock session
    lock_cmd = sh -c 'pidof swaylock >/dev/null || swaylock -c 000000 -e -n -f & sleep 0.5; hyprctl monitors -j | jq -e ".[] | select(.dpmsStatus == true)" >/dev/null && hyprctl dispatch dpms off'
    before_sleep_cmd = loginctl lock-session

    # After sleep: turn monitor back on
    after_sleep_cmd = hyprctl dispatch dpms on
}

listener {
    timeout = 300
    on-timeout = loginctl lock-session
}
listener {
    # Timeout after 5 minutes (300 seconds)
    timeout = 330

    # On timeout: lock screen, then turn off monitor and mark session locked
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

